name: Build Android

# Android APK：sh install.sh -a -c -f -d
#   -a 只构建 APK（跳过所有桌面打包）
#   -c 汉化上游（android-cn-repo）  -f 前端补丁  -d djui_modern
# install.sh 内部顺序：make TOUCH_CONTROLS=1（生成资源）→ gradlew assembleRelease → 收集 APK。
# SDK 走环境变量（ANDROID_HOME），不写 local.properties —— 那文件在 clone 出来的树里，
# 而 clone 发生在 install.sh 内部，工作流这边没法提前写。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64-v8a / x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK 与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 zip unzip wget apksigner \
            libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev

          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest

          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          # license 一并接受，Gradle 才能自动下 NDK（build.gradle 没写死 ndkVersion）
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译 APK
        run: sh install.sh -a -c -f -d -p no

      - name: 签名（用上游自带的测试证书）
        run: |
          KEY=build-iquedx/upstream/platform/android/key.pk8
          CERT=build-iquedx/upstream/platform/android/certificate.pem
          if [ ! -f "$KEY" ] || [ ! -f "$CERT" ]; then
            echo "::warning::上游没有自带签名证书，跳过签名（APK 仍是 unsigned）"
            exit 0
          fi
          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            apksigner sign --key "$KEY" --cert "$CERT" "$apk"
            apksigner verify --print-certs "$apk" | head -3
          done

      - name: 列出产物
        run: ls -la dist

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-android
          if-no-files-found: error
          retention-days: 14
          path: dist/
