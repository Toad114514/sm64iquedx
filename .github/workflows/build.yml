name: Build

# 一条流水线覆盖全部平台（原来是 Build Desktop / Build Android 两个文件，
# 现在合成一个：同一个 concurrency 组，push 一次只跑一套，取消也一起取消）。
#
#   linux       ubuntu-22.04       x86_64  → deb / rpm / arch / portable-zip
#   linux-arm   ubuntu-22.04-arm   aarch64 → deb / arch / portable-zip（不出 rpm）
#   windows     windows-latest     x86_64  → setup.exe / portable-zip
#   macos       macos-latest       arm64   → dmg / portable-zip
#             + macos-15-intel     x86_64  → dmg / portable-zip
#   android     ubuntu-22.04       arm64-v8a / x86_64 → apk
#
# 桌面统一流程：sh install.sh ${IQDX_BUILD_ARGS} -p no  →  sh install.sh -po -p all  → 上传。
#   编译选项由 workflow_dispatch 的输入拼出来（见下面 on / env）：
#     上游      汉化版(-c) | 原版（无 -c）
#     UIPatch   开启(-f)   | 关闭
#     djui_modern 开启(-d) | 关闭
#   push / PR 触发时三个输入不存在，走默认「汉化版 + 前端 + djui_modern」，
#   与加这些选项之前的行为完全一致。
#   -p no   只编译，不打任何格式的包
#   -po     只打包（跳过克隆/补丁/编译，直接吃上一步留下的 build-iquedx/upstream）
#
# ⚠️ 产物名（artifact）不含变体标记：下载前先看 run 的「编译选项」日志行。
#
# 产物按格式拆成独立 artifact（不要一个几百 MB 的 zip 里套 dist/），名字里带架构，
# 因为同一个系统的两种架构会产出同名文件。
# Arch 包需要 makepkg：x86_64 进 archlinux:latest，aarch64 进 menci/archlinuxarm
# （官方 archlinux 镜像只有 x86_64）。两者都在容器里跑，宿主机不需要 Arch。

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '上游仓库'
        type: choice
        default: 汉化版
        options:
          - 汉化版
          - 原版
      frontend:
        description: '应用 UIPatch 前端补丁（0002：设置 → 其他 → 神游汉化）'
        type: boolean
        default: true
      djui_modern:
        description: '应用 djui_modern 界面模块'
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ── 编译选项（所有 job 共用）─────────────────────────────────────────────────
# 为什么用 github.event.inputs 而不是 inputs.*：
#   1) workflow_dispatch 的输入在 push/PR 下根本不存在，`|| 默认值` 才能兜底；
#   2) event.inputs 的值**永远是字符串**，不会踩 boolean 的 falsy 陷阱——
#      `false` 在 `a && b || c` 里是假值，`'false'` 才是真值。
# 为什么真分支写非空串（'-c'）而不是空串：
#   `cond && '' || '-c'` 在 cond 为真时 `true && ''` 得到空串（假值），会被 `||`
#   吃掉，结果永远返回 '-c'。所以只能是「条件真 → 非空串」这个方向。
env:
  IQDX_CHINESE: ${{ github.event.inputs.upstream || '汉化版' }}
  IQDX_FRONTEND: ${{ github.event.inputs.frontend || 'true' }}
  IQDX_DJUI: ${{ github.event.inputs.djui_modern || 'true' }}
  IQDX_BUILD_ARGS: >-
    ${{ (github.event.inputs.upstream || '汉化版') == '汉化版' && '-c' || '' }}
    ${{ (github.event.inputs.frontend || 'true') == 'true' && '-f' || '' }}
    ${{ (github.event.inputs.djui_modern || 'true') == 'true' && '-d' || '' }}

jobs:
  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  linux:
    name: Linux x86_64 (deb / rpm / arch / zip)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # rpm 提供 rpmbuild；只给 -po -p all 的 rpm 分支用
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-yaml zip \
            libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev \
            rpm

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      # 编译选项是 workflow_dispatch 的输入拼出来的，这里按 GitHub 表达式的语义
      # 把 7 种组合重新求值一遍（boolean 的 false 是假值、真分支不能写空串，
      # 这两个坑改一行就可能踩回去）。缺 PyYAML 会自己跳过，不会把 job 弄红。
      - name: 校验 workflow 编译选项（离线）
        run: python3 scripts/check_workflow_inputs.py

      - name: 编译
        run: |
          echo "编译选项：${IQDX_BUILD_ARGS:-（无：原版 + 不带可选模块）}"
          echo "  上游=$IQDX_CHINESE  前端=$IQDX_FRONTEND  djui_modern=$IQDX_DJUI"
          sh install.sh ${IQDX_BUILD_ARGS} -p no

      - name: 打包（只用已有构建产物）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 打包 Arch（ubuntu 没有 makepkg，进 archlinux 容器跑）
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/w" -w /w archlinux:latest bash -euc '
              # 新容器第一次用 pacman 必须先建 keyring，否则包签名校验直接失败
              pacman-key --init >/dev/null
              pacman-key --populate archlinux >/dev/null
              pacman -Sy --noconfirm --needed base-devel >/dev/null
              # makepkg 拒绝 root
              useradd -m builder
              chown -R builder /w
              su builder -c "sh install.sh -po -p arch --path build-iquedx/upstream"
              chown -R "$HOST_UID:$HOST_GID" /w
            '

      - name: 列出产物
        run: |
          echo "== 安装包 =="
          ls -la ./*.deb ./*.rpm ./*.pkg.tar.* ./*.zip 2>/dev/null || true

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-x86_64-deb
          if-no-files-found: error
          retention-days: 14
          path: |
            *.deb
            dist/*.deb

      - name: 上传 .rpm
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-x86_64-rpm
          if-no-files-found: error
          retention-days: 14
          path: |
            *.rpm
            dist/*.rpm

      - name: 上传 Arch 包
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-x86_64-arch
          if-no-files-found: error
          retention-days: 14
          path: |
            *.pkg.tar.*
            dist/*.pkg.tar.*

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-x86_64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  # ── Linux aarch64 ───────────────────────────────────────────────────────────
  linux-arm:
    # GitHub 的 arm64 标准 runner（公开仓库免费）。用 22.04 是为了和 x86_64 那个
    # job 的编译器版本一致，少一个「24.04 的 gcc 报新警告」的变量。
    name: Linux aarch64 (deb / arch / zip)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # 不装 rpm：aarch64 只出 deb / pacman / portable-zip，
          # -po -p all 的 rpm 分支会因为找不到 rpmbuild 自动跳过并警告。
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 zip \
            libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        run: |
          echo "编译选项：${IQDX_BUILD_ARGS:-（无：原版 + 不带可选模块）}"
          echo "  上游=$IQDX_CHINESE  前端=$IQDX_FRONTEND  djui_modern=$IQDX_DJUI"
          sh install.sh ${IQDX_BUILD_ARGS} -p no

      # aarch64 拆成两步打：坏在 deb 还是 zip，一眼就看出来。
      # （`-p all` 在 Linux 上会一次跑 deb/rpm/arch/zip，出错只剩一个 exit code）
      - name: 打包 .deb
        env:
          IQDX_DEBUG: 1
        run: sh install.sh -po -p deb --path build-iquedx/upstream

      - name: 打包便携 zip
        env:
          IQDX_DEBUG: 1
        run: sh install.sh -po -p zip --path build-iquedx/upstream

      - name: 打包 Arch（官方 archlinux 镜像没有 arm64，用 menci/archlinuxarm）
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/w" -w /w menci/archlinuxarm:base-devel bash -euc '
              # 镜像里已经装好 base-devel（含 makepkg / fakeroot / zstd），
              # 不需要再动 pacman；-po 分支也不要求 git。
              useradd -m builder
              chown -R builder /w
              su builder -c "sh install.sh -po -p arch --path build-iquedx/upstream"
              chown -R "$HOST_UID:$HOST_GID" /w
            '

      - name: 列出产物
        run: |
          echo "== 安装包 =="
          ls -la ./*.deb ./*.pkg.tar.* ./*.zip 2>/dev/null || true
          echo "== deb 架构字段 =="
          dpkg-deb -f ./*.deb Architecture 2>/dev/null || true

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-aarch64-deb
          if-no-files-found: error
          retention-days: 14
          path: |
            *.deb
            dist/*.deb

      - name: 上传 Arch 包
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-aarch64-arch
          if-no-files-found: error
          retention-days: 14
          path: |
            *.pkg.tar.*
            dist/*.pkg.tar.*

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-aarch64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  # ── Windows ─────────────────────────────────────────────────────────────────
  windows:
    name: Windows (setup.exe / zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            make
            zip
            unzip
            python3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2

      - name: 安装 Inno Setup（打安装向导用）
        # 这个 job 的默认 shell 是 msys2，choco 得单独用 pwsh 跑
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Inno Setup 6 的默认安装位置；choco 静默安装不会改它
          $iscc = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "装完找不到 $iscc" }
          # 用正斜杠：msys2 里的 mkexe.sh 用 [ -f ] 判断，两种都能认，
          # 但正斜杠在两边都不需要转义。
          # 编码用 ascii：PS 5.1 的 utf8 会写 BOM，$GITHUB_ENV 第一行带 BOM 时
          # 变量名会变成 "\ufeffISCC"，后面就取不到了。
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "ISCC = $iscc"

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        run: |
          echo "编译选项：${IQDX_BUILD_ARGS:-（无：原版 + 不带可选模块）}"
          echo "  上游=$IQDX_CHINESE  前端=$IQDX_FRONTEND  djui_modern=$IQDX_DJUI"
          sh install.sh ${IQDX_BUILD_ARGS} -p no

      # -p all 在 Windows 上出两样：Inno Setup 安装向导 + 便携 zip。
      # 万一 ISCC 没找到，setup 分支只警告、zip 照出，不会整步失败。
      - name: 打包（安装向导 + 便携 zip）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 列出产物
        run: |
          ls -la dist | head -20 || true
          ls -la ./*.exe ./*.zip 2>/dev/null || true

      # ISCC 编译通过只说明脚本语法没问题，装得对不对没人验。静默装到一个
      # 临时目录、检查主程序在不在、再静默卸掉 —— 三条都过了才算向导能用。
      # /DIR 是原生程序参数，必须是 Windows 路径。
      #
      # ⚠️ 必须关掉 MSYS2 的参数改写。这个 job 的默认 shell 是 msys2，它会把
      # 「/ 开头」的 argv 当成 POSIX 路径改写（/VERYSILENT → C:/msys64/VERYSILENT，
      # /DIR=C:\... → 同样被改坏）。Inno 认不出这些开关就当没传，于是**弹图形向导
      # 等人点下一步**；无头 runner 上没人可点，就一路挂到 job 超时。
      # 首次上线时正是如此：编译只用 8 分半，冒烟步骤挂了 5 小时 49 分，
      # 最后被 6 小时 job 上限杀掉（run 43164325739）。mkexe.sh 调 ISCC 时的
      # /D 参数踩的是同一个坑，见那里的注释。
      #
      # timeout-minutes 是第二道保险：即使将来又冒出别的「等输入」型挂起，
      # 也只在十分钟内失败，不会白烧掉整个 job 预算。
      - name: 冒烟测试安装向导（静默安装 → 检查 → 卸载）
        timeout-minutes: 10
        run: |
          set -e
          MSYS2_ARG_CONV_EXCL='*'
          export MSYS2_ARG_CONV_EXCL

          setup=$(ls ./*-setup.exe | head -n 1)
          echo "被测安装包：${setup}"
          target="$PWD/smoke-install"
          log="$PWD/smoke-install.log"
          rm -rf "$target" "$log"

          # 装不上时把 Inno 自己的日志打出来，比只报「没有 exe」好查得多
          dump_log() {
            echo "── 安装日志（末 60 行）──"
            tail -n 60 "$log" 2>/dev/null || echo "（没有日志文件）"
            echo "── 目录内容 ──"
            ls -la "$target" 2>/dev/null || echo "（目录不存在）"
          }
          trap 'dump_log' EXIT

          ./"$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$(cygpath -w "$log")" \
                     "/DIR=$(cygpath -w "$target")"
          test -f "$target/sm64coopdx.exe" || { echo "装完了但没有 sm64coopdx.exe"; exit 1; }
          test -f "$target/unins000.exe"    || { echo "装完了但没有卸载程序"; exit 1; }
          test -d "$target/dynos"           || { echo "装完了但没有 dynos 目录（[Files] 递归没生效）"; exit 1; }
          echo "安装成功，开始卸载"
          "$target/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          # 卸载器是异步的，等它真的消失（最多 30 秒）
          i=0
          while [ -f "$target/sm64coopdx.exe" ] && [ "$i" -lt 30 ]; do
            sleep 1; i=$((i + 1))
          done
          [ -f "$target/sm64coopdx.exe" ] && { echo "卸载后主程序还在"; exit 1; }
          trap - EXIT
          echo "安装 / 卸载都正常"
          rm -rf "$target" "$log" || true

      - name: 上传安装向导（setup.exe）
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-windows-x86_64-setup
          if-no-files-found: error
          retention-days: 14
          path: |
            *-setup.exe
            dist/*-setup.exe

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-windows-x86_64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  # ── macOS（arm64 + Intel）───────────────────────────────────────────────────
  macos:
    # 一个矩阵同时出 Apple Silicon 与 Intel：
    #   macos-latest   → arm64（M1，brew 前缀 /opt/homebrew）
    #   macos-15-intel → x86_64（brew 前缀 /usr/local）
    # macos-13 已于 2025-12-04 下线；macos-15-intel 是 GitHub 最后一个 Intel 镜像，
    # 官方说 2027 年秋停止支持 x86_64 macOS，届时这个腿要删掉。
    name: macOS ${{ matrix.arch }} (dmg / zip)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          # coreutils 是硬需求：上游 Makefile 里 `ifeq ($(HOST_OS),Darwin) CP := gcp`
          # （注释原文 "thank you apple very cool"），没有 gcp 直接
          # `gmake: gcp: No such file or directory` 退 2。
          brew install make pkg-config sdl2 glew coreutils

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        env:
          # Intel runner 的 brew 前缀是 /usr/local，两个都放上，别写死 /opt/homebrew
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
        run: |
          echo "编译选项：${IQDX_BUILD_ARGS:-（无：原版 + 不带可选模块）}"
          echo "  上游=$IQDX_CHINESE  前端=$IQDX_FRONTEND  djui_modern=$IQDX_DJUI"
          sh install.sh ${IQDX_BUILD_ARGS} -p no

      - name: 检查 .app 自包含（不能链回 brew）
        run: |
          app=build-iquedx/upstream/build/us_pc/sm64coopdx.app/Contents/MacOS
          ls -l "$app"
          brew_prefix=$(brew --prefix)
          bad=$(otool -L "$app/sm64coopdx" | grep -E "$brew_prefix/(lib|opt)" || true)
          if [ -n "$bad" ]; then
            echo "::error::可执行文件还链着 brew 里的库（换台机器跑不起来）："
            printf '%s\n' "$bad"
            exit 1
          fi
          for lib in libSDL2.dylib libGLEW.dylib; do
            if [ ! -s "$app/$lib" ]; then
              echo "::error::.app 缺 $lib"
              exit 1
            fi
          done
          file "$app/sm64coopdx"

      - name: 打包（app + dmg，含 ad-hoc 签名）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 列出产物
        run: |
          ls -la dist | head -20
          ls -la ./*.dmg ./*.zip 2>/dev/null || true

      - name: 上传 .dmg
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-macos-${{ matrix.arch }}-dmg
          if-no-files-found: error
          retention-days: 14
          path: |
            *.dmg
            dist/*.dmg

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-macos-${{ matrix.arch }}-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  # ── Android ─────────────────────────────────────────────────────────────────
  android:
    name: Android (arm64-v8a / x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK 与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 zip unzip wget apksigner \
            libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev

          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest

          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          # license 一并接受，Gradle 才能自动下 NDK（build.gradle 没写死 ndkVersion）
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      # install.sh 内部顺序：make TOUCH_CONTROLS=1（生成资源）→ gradle assembleRelease → 收集 APK。
      - name: 编译 APK
        run: |
          echo "编译选项：${IQDX_BUILD_ARGS:-（无：原版 + 不带可选模块）}"
          echo "  上游=$IQDX_CHINESE  前端=$IQDX_FRONTEND  djui_modern=$IQDX_DJUI"
          sh install.sh -a ${IQDX_BUILD_ARGS} -p no

      - name: 签名（用上游自带的测试证书）
        run: |
          KEY=build-iquedx/upstream/platform/android/key.pk8
          CERT=build-iquedx/upstream/platform/android/certificate.pem
          if [ ! -f "$KEY" ] || [ ! -f "$CERT" ]; then
            echo "::warning::上游没有自带签名证书，跳过签名（APK 仍是 unsigned）"
            exit 0
          fi
          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            apksigner sign --key "$KEY" --cert "$CERT" "$apk"
            apksigner verify --print-certs "$apk" | head -3
          done

      - name: 列出产物
        run: ls -la dist

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-android
          if-no-files-found: error
          retention-days: 14
          path: dist/
