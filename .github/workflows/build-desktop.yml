name: Build Desktop

# 桌面三平台：Linux / Windows / macOS。
# 统一流程：sh install.sh -c -f -d -p no  →  sh install.sh -po -p all  → 上传。
#   -c 汉化上游  -f 前端补丁  -d djui_modern
#   -p no   只编译，不打任何格式的包
#   -po     只打包（跳过克隆/补丁/编译，直接吃上一步留下的 build-iquedx/upstream）
#
# 产物按格式拆成独立 artifact（不要一个几百 MB 的 zip 里套 dist/）：
#   linux   → deb / rpm / arch / portable-zip
#   windows → portable-zip
#   macos   → dmg / portable-zip
# arch 包在 ubuntu 上没法打（没有 makepkg），所以多一步 docker + archlinux 容器。
# Linux 上 -po -p all 会依次尝试 deb / rpm / arch，缺工具只警告不中断。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (deb / rpm / arch / zip)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # rpm 提供 rpmbuild；包一层是给 -po -p all 的 rpm 分支用的
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 zip \
            libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev \
            rpm

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        run: sh install.sh -c -f -d -p no

      - name: 打包（只用已有构建产物）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 打包 Arch（ubuntu 没有 makepkg，进 archlinux 容器跑）
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/w" -w /w archlinux:latest bash -euc '
              # 新容器第一次用 pacman 必须先建 keyring，否则包签名校验直接失败
              pacman-key --init >/dev/null
              pacman-key --populate archlinux >/dev/null
              pacman -Sy --noconfirm --needed base-devel git >/dev/null
              # makepkg 拒绝 root
              useradd -m builder
              chown -R builder /w
              su builder -c "sh install.sh -po -p arch --path build-iquedx/upstream"
              chown -R "$HOST_UID:$HOST_GID" /w
            '

      - name: 列出产物
        run: |
          echo "== 安装包 =="
          ls -la ./*.deb ./*.rpm ./*.pkg.tar.* ./*.zip 2>/dev/null || true

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-deb
          if-no-files-found: error
          retention-days: 14
          path: |
            *.deb
            dist/*.deb

      - name: 上传 .rpm
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-rpm
          if-no-files-found: error
          retention-days: 14
          path: |
            *.rpm
            dist/*.rpm

      - name: 上传 Arch 包
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-arch
          if-no-files-found: error
          retention-days: 14
          path: |
            *.pkg.tar.*
            dist/*.pkg.tar.*

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-linux-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            make
            zip
            unzip
            python3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        run: sh install.sh -c -f -d -p no

      - name: 打包（Windows 不出安装包，只整理成品目录）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-windows-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip

  macos:
    name: macOS (dmg / zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          # coreutils 是硬需求：上游 Makefile 里 `ifeq ($(HOST_OS),Darwin) CP := gcp`
          # （注释原文 "thank you apple very cool"），没有 gcp 直接
          # `gmake: gcp: No such file or directory` 退 2。
          brew install make pkg-config sdl2 glew coreutils

      - name: 参数自测（离线）
        run: sh scripts/test_install_args.sh

      - name: 编译
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
        run: sh install.sh -c -f -d -p no

      - name: 检查 .app 自包含（不能链回 /opt/homebrew）
        run: |
          app=build-iquedx/upstream/build/us_pc/sm64coopdx.app/Contents/MacOS
          ls -l "$app"
          bad=$(otool -L "$app/sm64coopdx" | grep -E '/opt/homebrew|/usr/local' || true)
          if [ -n "$bad" ]; then
            echo "::error::可执行文件还链着 brew 里的库（换台机器跑不起来）："
            printf '%s\n' "$bad"
            exit 1
          fi
          for lib in libSDL2.dylib libGLEW.dylib; do
            if [ ! -s "$app/$lib" ]; then
              echo "::error::.app 缺 $lib"
              exit 1
            fi
          done

      - name: 打包（app + dmg，含 ad-hoc 签名）
        run: sh install.sh -po -p all --path build-iquedx/upstream

      - name: 列出产物
        run: |
          ls -la dist | head -20
          ls -la ./*.dmg ./*.zip 2>/dev/null || true

      - name: 上传 .dmg
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-macos-dmg
          if-no-files-found: error
          retention-days: 14
          path: |
            *.dmg
            dist/*.dmg

      - name: 上传便携 zip
        uses: actions/upload-artifact@v4
        with:
          name: sm64iquedx-macos-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            *.zip
            dist/*.zip
